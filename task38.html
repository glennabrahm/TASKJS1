<!DOCTYPE html>
<html>
    <head>
        <style>
            table {
                width: 50%;
                margin-left: auto;
                margin-right: auto;
            }
            td {
                padding: 8px;
            }
            input, select {
                width: 100%;
                padding: 6px;
                box-sizing: border-box;
            }
        </style>
    </head>

    
    <body>
        <h2 style="text-align: center;">Create Account</h2>

        <form onsubmit="return create()">
        <table>
            <tr>
                <td>
                    <label for="fname"></label><br>
                    <input type="text" id="fname" name="fname" placeholder="First Name"  required>
                </td>
                <td>
                    <label for="lname"></label><br>
                    <input type="text" id="lname" name="lname" placeholder="Last Name"  required>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <select id="country" name="country"  required>
                        <option value="" disabled selected>Country</option>
                        <option value="indonesia">Indonesia</option>
                        <option value="japan">Japan</option>
                        <option value="south korea">South Korea</option>
                        <option value="china">China</option>
                        <option value="other">Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email"></label><br>
                    <input type="email" id="email" name="email" placeholder="Email"  required>
                </td>

                <td>
                    <label for="phone"></label><br>
                    <input type="phone" name="phone" id="phone" placeholder="Phone Number"  required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="pwd"></label><br>
                    <input type="password" id="pwd" name="pwd" placeholder="Password" required>
                </td>

                <td>
                    <label for="confirm_pwd"></label><br>
                    <input type="password" id="confirm_pwd" name="confirm_pwd" placeholder="Confirm Password"  required>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox" id="terms" name="terms" style="width: auto;"  required>
                    <label for="terms">Terms and Conditions</label>
                </td>
            </tr>

            <tr>
                 <td colspan="2" style="text-align: center;">
                    <button type="submit" value="Create" style="width: 50%; height: 70%;" onclick="create()">Create</button>
                 </td>
            </tr>
        </table>
    </form>

    </div>
            <p id="result"></p>
    </div>

    <script>
        function create() {
            var fname = document.getElementById("fname").value;
            var lname = document.getElementById("lname").value;
            var coun = document.getElementById("country").value;
            var mail = document.getElementById("email").value;
            var numb = document.getElementById("phone").value;
            var pass = document.getElementById("pwd").value;
            var con = document.getElementById("confirm_pwd").value;
            var terms = document.getElementById("terms").checked;
        
            if (
                fname === "" ||
                lname === "" ||
                coun === "" ||
                mail === "" ||
                numb === "" ||
                pass === "" ||
                con === ""
            ) {
        alert("Wajib isi form!");
        return false;
    }
            if (!terms) {
                alert("Harus centang Terms and Conditions!");
                return false;
            }
        
            if (pass !== con) {
                alert("Password tidak sama");
                return false;
            }
        
            document.getElementById("result").innerHTML =
                fname + " " + lname + " from " + coun + " with email " + mail + " and number " + numb + " password already same!";
        
            return false; 
        }
        </script>

    </body>
</html>

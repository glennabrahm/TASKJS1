<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name ="viewport" content="width=device-width, initial-scale=1">
        <title>Javascript</title>
    </head>
    <body>
<script>

var pilihan = ["batu", "gunting", "kertas"];
var userScore = 0;
var compScore = 0;

for (var i = 1; i <= 3; i++) {

    var user = prompt("Pilih batu, gunting, kertas:");

    var random = Math.floor(Math.random() * 3);
    var comp = pilihan[random];

    var hasil = "";

    if (user === comp) {
        hasil = "Seri";
    } 
    else if (
        (user === "gunting" && comp === "kertas") ||
        (user === "kertas" && comp === "batu") ||
        (user === "batu" && comp === "gunting")
    ) {
        hasil = "User Wins";
        userScore++;
    } 
    else {
        hasil = "Computer Wins";
        compScore++;
    }

    console.log("User " + user + " vs Computer " + comp + " = " + hasil);
}

if (userScore > compScore) {
    console.log("User wins the game!");
} else if (compScore > userScore) {
    console.log("Computer wins the game!");
} else {
    console.log("Game seri!");
}

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1">
    <title>Javascript</title>
</head>
<body></br>
    <div class="w3-container">
        <div class="w3-container w3-cell">
        <p><label>First Name</label>
        <input class="w3-input w3-border" id="fname" type="text"></p>
        <p><label>Last Name</label>
        <input class="w3-input w3-border" id="Iname" type="text"></p>
        <p><button class="w3-button W3-blue" onclick="enter()">enter</button></p>
    </div>

    </div>
        <div class="w3-container">
            <div class="w3-container w3-cell">
            <p id="result"></p>
        </div>
    </div>

        <script>
        function enter() {
            var fname = document.getElementById("fname"). value;
            var Iname = document.getElementById("Iname"). value;
            document.getElementById("result"). innerHTML=fname + '' + Iname;
            }
        </script>
</body>
</html>

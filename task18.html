<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>While Case Study 2</title>
  </head>
  <body>
    <script type="text/javascript">
      var counter;
      counter = 0;
      total = 0;
      while (true) {
        number = prompt("Input your number!");
        console.log("you entered: " + number);
        total += Number(number);
        counter += 1;

        if (number == -1) {
          break;
        }
      }
      console.log("Program stop");
      console.log("Total Number : " + total);
    </script>
  </body>
</html>

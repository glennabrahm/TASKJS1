<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name ="viewport" content="width=device-width, initial-scale=1">
        <title>Javascript</title>
    </head>
    <body>
        <script type="text/javascript">
            
         
        var hasil = 0;

        while(true){
            var masukan = Number(prompt('masukkan angka '));

            if(masukan===-1){
                break;
            }

            hasil+=masukan;
        }

        console.log(hasil)


        </script>
    </body>
</html>

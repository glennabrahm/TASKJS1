<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name ="viewport" content="width=device-width, initial-scale=1">
        <title>Javascript</title>
    </head>
    <body>
        <script type="text/javascript">
            var user = 'admin'
            var pass = 1234
            var username = prompt("masukkan username")
            var passcode = prompt("masukkan password")

            if (username==user && passcode==pass){
                console.log('login true')
            }
            else{
                alert('incorrect username or pascode')
                console.log('login false')
            }
            
        </script>
    </body>
</html>
